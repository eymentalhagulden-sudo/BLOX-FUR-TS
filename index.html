<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Değişik SMP | Eğlencenin Yeni Adresi</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Arka Plan Karartma Katmanı -->
    <div class="overlay"></div>

    <!-- Ana Konteyner -->
    <div class="hero-container">
        
        <!-- Logo Bölümü -->
        <div class="logo-area">
            <!-- İstersen buraya bir logo görseli de koyabilirsin: <img src="logo.png" alt="Logo">-->
            <h1>DEĞİŞİK <span class="highlight">SMP</span></h1>
            <p>Sıradan sunuculardan sıkılmadın mı? Macera burada başlıyor!</p>
        </div>

        <!-- IP Kopyalama Alanı -->
        <div class="ip-box" onclick="copyIP()">
            <div class="ip-text">
                <i class="fa-solid fa-gamepad"></i>
                <span id="server-ip">play.degisiksmp.com</span>
            </div>
            <div class="copy-btn">
                <i class="fa-solid fa-copy"></i>
                <span id="copy-tooltip">KOPYALA</span>
            </div>
        </div>

        <!-- Canlı Oyuncu Sayısı (Statik, dilersen API bağlayabilirsin) -->
        <div class="player-count">
            <span class="online-dot"></span> <b id="online-players">42</b> Oyuncu Aktif!
        </div>

        <!-- Butonlar (ChickenNW Tarzı) -->
        <div class="action-buttons">
            <a href="https://discord.gg/davetlinkin" target="_blank" class="btn btn-discord">
                <i class="fa-brands fa-discord"></i> Discord'a Katıl
            </a>
            <a href="/magaza" class="btn btn-store">
                <i class="fa-solid fa-shopping-cart"></i> Mağaza / Market
            </a>
            <a href="/kayit" class="btn btn-web">
                <i class="fa-solid fa-user-plus"></i> Kayıt Ol
            </a>
        </div>

    </div>

    <!-- IP Kopyalama JavaScript Kodu -->
    <script>
        function copyIP() {
            const ipText = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                const tooltip = document.getElementById('copy-tooltip');
                tooltip.innerText = 'KOPYALANDI!';
                tooltip.style.background = '#2ecc71';
                
                setTimeout(() => {
                    tooltip.innerText = 'KOPYALA';
                    tooltip.style.background = 'rgba(255, 255, 255, 0.1)';
                }, 2000);
            });
        }
    </script>
</body>
</html>
