<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuyuDenge-AI Kabin Giriş & Analiz</title>
    
    <!-- Yapay Zeka Yüz Tanıma Kütüphanesi -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #060b16; color: white; text-align: center; padding: 20px; margin: 0; }
        .box { background: #0f172a; padding: 30px; border-radius: 15px; max-width: 500px; margin: 20px auto; border: 1px solid #00f2fe; box-shadow: 0 0 20px rgba(0,242,254,0.2); }
        button { background: linear-gradient(135deg, #4facfe, #00f2fe); color: black; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; width: 100%; margin-bottom: 15px; }
        button:hover { transform: scale(1.02); box-shadow: 0 0 15px #00f2fe; }
        
        .divider { margin: 20px 0; color: #64748b; font-size: 0.9rem; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #1e293b; }
        .divider::before { left: 0; } .divider::after { right: 0; }

        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #020617; border: 1px solid #1e293b; border-radius: 6px; color: white; font-size: 0.95rem; box-sizing: border-box; }
        input:focus { border-color: #00f2fe; outline: none; }

        #kabinAlani { display: none; }
        .camera-box { width: 100%; max-width: 450px; margin: 20px auto; border-radius: 12px; overflow: hidden; border: 2px solid #1e293b; background: #000; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #aiDurum { background: rgba(0, 242, 254, 0.05); padding: 15px; border-radius: 8px; border-left: 4px solid #00f2fe; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- GİRİŞ PORTALI -->
    <div id="loginKutusu" class="box">
        <h2>🧠 DuyuDenge-AI Akıllı Kabin</h2>
        <p style="color: #64748b; font-size:0.9rem;">Analizin başlaması için aşağıdaki yöntemlerden biriyle oturum açın.</p>
        
        <button id="loginBtn">🌐 Google ile Hızlı Giriş Yap</button>
        
        <div class="divider">VEYA MANUEL GİRİŞ</div>
        
        <div class="form-group">
            <label>Öğrenci Numarası</label>
            <input type="number" id="okulNo" placeholder="Örn: 1045">
        </div>
        <div class="form-group">
            <label>Adınız ve Soyadınız</label>
            <input type="text" id="adSoyad" placeholder="Örn: Ahmet Yılmaz">
        </div>
        <div class="form-group">
            <label>Sınıfınız / Şubeniz</label>
            <input type="text" id="sinif" placeholder="Örn: 10-A">
        </div>
        <button id="manuelGirisBtn" style="background: linear-gradient(135deg, #a855f7, #6366f1); color: white; margin-top: 10px;">🔐 Bilgilerle Kabine Giriş Yap</button>
    </div>

    <!-- KABIN AKTIF EKRANI -->
    <div id="kabinAlani">
        <div class="box" style="max-width: 640px;">
            <h3>Hoş geldin, <span id="kullaniciAdi" style="color:#00f2fe">...</span></h3>
            <p style="color: #64748b;">Sistem şu an Firebase bulut veri tabanına bağlı. Verileriniz güvenle işleniyor.</p>
            
            <div class="camera-box">
                <video id="webcam" autoplay muted playsinline></video>
            </div>
            
            <h4 id="aiDurum">Yapay zekâ modelleri yükleniyor...</h4>
        </div>
    </div>

    <!-- FIREBASE MODÜLER SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        // Kabin uygulamasının kendi config bilgileri kanka
        const firebaseConfig = {
            apiKey: "AIzaSyB-sjEa93bNOoplmYYpqF1cfTqvb0mm7Dk",
            authDomain: "duyu-kabini.firebaseapp.com",
            projectId: "duyu-kabini",
            storageBucket: "duyu-kabini.firebasestorage.app",
            messagingSenderId: "411207534602",
            appId: "1:411207534602:web:838c1a373019e951b5b7f3",
            measurementId: "G-GXHJHBN35V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let cihazUser = { uid: null, displayName: null };
        let baskinDuygu = "neutral";
        const video = document.getElementById('webcam');
        const aiDurum = document.getElementById('aiDurum');

        document.getElementById('loginBtn').addEventListener('click', googleIleGiris);
        document.getElementById('manuelGirisBtn').addEventListener('click', manuelGirisYap);

        function googleIleGiris() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).then(result => {
                cihazUser.uid = result.user.uid;
                cihazUser.displayName = result.user.displayName;
                sistemiGoster(cihazUser.displayName);
            }).catch(err => {
                alert("Edge kısıtlaması nedeniyle Google girişi atlandı! Lütfen okul formuyla giriş yapın.");
            });
        }

        function manuelGirisYap() {
            const no = document.getElementById('okulNo').value.trim();
            const ad = document.getElementById('adSoyad').value.trim();
            const sınıf = document.getElementById('sinif').value.trim();

            if(!no || !ad || !sınıf) {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }

            cihazUser.uid = "okul_" + no + "_" + Date.now();
            cihazUser.displayName = no + " - " + ad + " (" + sınıf + ")";
            sistemiGoster(cihazUser.displayName);
        }

        function sistemiGoster(gosterilecekIsim) {
            document.getElementById('loginKutusu').style.display = 'none';
            document.getElementById('kabinAlani').style.display = 'block';
            document.getElementById('kullaniciAdi').innerText = gosterilecekIsim;
            initAI();
        }

        async function initAI() {
            try {
                const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                aiDurum.innerText = "Modeller yüklendi. Kamera açılıyor...";
                
                startVideo();
                setInterval(bulutaVeriGonder, 4000);
            } catch (err) {
                aiDurum.innerText = "AI yükleme hatası!";
            }
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} }).then(stream => { 
                video.srcObject = stream; 
            });
            video.addEventListener('play', () => { 
                setInterval(trackFace, 400); 
            });
        }

        async function trackFace() {
            if (!video.srcObject) return;
            const result = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
            if (result && result.expressions) {
                let maxEmotion = 'neutral'; let maxScore = 0;
                for (const [em, sc] of Object.entries(result.expressions)) {
                    if (sc > maxScore) { maxScore = sc; maxEmotion = em; }
                }
                baskinDuygu = maxEmotion;
                aiDurum.innerHTML = "Algılanan Durum: <strong style='color:#00f2fe'>" + maxEmotion.toUpperCase() + "</strong>";
            }
        }

        async function bulutaVeriGonder() {
            if(!cihazUser.uid) return;
            try {
                await addDoc(collection(db, "kabin_loglari"), {
                    userId: cihazUser.uid,
                    userName: cihazUser.displayName,
                    duygu: baskinDuygu,
                    bpm: Math.floor(Math.random() * (92 - 66 + 1)) + 66,
                    zaman: serverTimestamp()
                });
                console.log("Buluta veri uçtu!");
            } catch (err) {
                console.error("Bulut hatası: ", err);
            }
        }
    </script>
</body>
</html>
